# Kubernetes refuses to create a pod referencing a ServiceAccount that does not exist, so
# without this the ReplicaSet reports FailedCreate and no pod appears at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: product-service-sa
  namespace: ecommerce-dev
  annotations:
    # Client ID of uai-workload-product-service-dev. This identity belongs to product-service
    # alone -- each service has its own, and they are not interchangeable. Using another
    # service's id fails token exchange at runtime with AADSTS70021, never at apply time.
    #
    #   terraform output -json workload_identity_client_ids | jq -r '."product-service"'
