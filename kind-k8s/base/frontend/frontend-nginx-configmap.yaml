# The frontend image has nginx.conf baked in at build time, and that copy carries AKS's
# cluster DNS address (10.0.0.10). kind's CoreDNS is 10.96.0.10, so every proxied API call
# would fail to resolve while static files kept serving fine -- the page loads and every
# request 502s.
#
# Mounting this ConfigMap over /etc/nginx/nginx.conf fixes it with no image rebuild. Only
# that one file is replaced (subPath in the Deployment), so proxy-common.conf and the
# static assets from the image are untouched.
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: ecommerce-dev
data:
  nginx.conf: |
    worker_processes auto;
    
    # Writable only by root by default; the container runs nginx as a non-root
    # user, so pid and all temp paths must live under /tmp instead.
    pid /tmp/nginx.pid;
    
    events {
      worker_connections 1024;
    }
    
    http {
      include       /etc/nginx/mime.types;
      default_type  application/octet-stream;
      sendfile      on;
      gzip          on;
      gzip_types    text/css application/javascript application/json;
    
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path       /tmp/proxy_temp;
      fastcgi_temp_path     /tmp/fastcgi_temp;
      uwsgi_temp_path       /tmp/uwsgi_temp;
      scgi_temp_path        /tmp/scgi_temp;
    
      # Resolve upstream service names at REQUEST time instead of once when
      # nginx starts. Without this, `proxy_pass http://user-service:3001;` is
      # resolved a single time at boot — if that service isn't up yet (a very
      # normal race during a rollout) nginx fails to start and the pod
      # crash-loops forever, even after the dependency becomes healthy.
      #
      # 10.0.0.10 is the cluster DNS (kube-dns Service ClusterIP) on this AKS cluster.
      # Was 127.0.0.11, Docker's embedded DNS, which nothing listens on inside a pod --
      # static files would still serve fine while every proxied API call failed.
      #
      # Confirm it for a different cluster with:
      #   kubectl get svc kube-dns -n kube-system -o jsonpath='{.spec.clusterIP}'
      #
      # For docker-compose, switch this back to 127.0.0.11.
      resolver 10.96.0.10 valid=10s;  # kind CoreDNS (AKS was 10.0.0.10)
    
      server {
        listen 8080;
        server_name _;
    
        root /usr/share/nginx/html;
        index index.html;
    
        # The static app shell (index.html, app.js, styles.css).
        # CACHING: index.html, app.js and styles.css are NOT fingerprinted -- a new
        # deploy reuses the same URLs. With no Cache-Control header browsers guess a
        # freshness lifetime, usually ~10% of the file's age, so a two-week-old app.js
        # is treated as fresh for over a day. Anyone who loaded the page before a deploy
        # keeps running the OLD JavaScript, sees no error, and has no reason to reload.
        #
        # "no-cache" means store it but revalidate before reuse, NOT "do not store".
        # The ETag keeps that cheap: unchanged files come back 304 with no body.
        # The real fix is fingerprinted filenames (app.a1b2c3.js) with immutable
        # year-long caching, which needs a build step this static shell does not have.
        location / {
          try_files $uri $uri/ /index.html;
          add_header Cache-Control "no-cache" always;
          # SECURITY HEADERS for the HTML shell (P0.6). They live in THIS block because
          # nginx's add_header is all-or-nothing per level: a location with any add_header
          # inherits none from the server block. API responses get theirs from Helmet in
          # each service instead.
          #
          # Content-Security-Policy -- what the page may load, and from where:
          #   script-src 'self'          only our own app.js: no inline <script>, no eval,
          #                              so an injected <script> tag in a product name or
          #                              review does nothing
          #   style-src 'unsafe-inline'  app.js renders style="background-image:..." for
          #                              product photos; inline STYLE is low-risk, inline
          #                              SCRIPT is what CSP is really for
          #   img-src                    product photos come from images.unsplash.com
          #   font-src / style-src       Google Fonts (Inter)
          #   connect-src 'self'         fetch() may only call this origin -- a script that
          #                              did get in cannot ship tokens to another server
          #   frame-ancestors 'none'     nobody may frame the shop (clickjacking)
          add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
          add_header X-Content-Type-Options "nosniff" always;
          add_header X-Frame-Options "DENY" always;
          add_header Referrer-Policy "strict-origin-when-cross-origin" always;
          add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
          add_header Cross-Origin-Opener-Policy "same-origin" always;
        }
    
        # Upstreams are FULLY QUALIFIED and target port 80 on purpose.
        #
        # Port 80 because the Kubernetes Service listens there (targetPort forwards to the
        # container's 3001/3002/3003) -- connecting to :3001 on the Service is refused.
        #
        # Fully qualified because the `resolver` directive above makes nginx query that DNS
        # server directly, bypassing the search domains in /etc/resolv.conf that would
        # normally expand a bare "user-service". The namespace is baked in as a result; it
        # has to change if these ever move out of ecommerce-dev.
        #
        # --- user-service (port 3001): POST /register, POST /login, GET /profile,
        #     GET/POST /wishlist, DELETE /wishlist/:productId
        location ~ ^/(register|login|profile|wishlist|wishlist/.*)$ {
          set $upstream http://user-service.ecommerce-dev.svc.cluster.local:80;
          proxy_pass $upstream;
          include /etc/nginx/proxy-common.conf;
        }
    
        # --- product-service (port 3002): GET /products, GET /products/:id,
        #     GET /search, GET /categories, GET/POST /products/:id/reviews
        location ~ ^/(products|products/.*|search|categories)$ {
          set $upstream http://product-service.ecommerce-dev.svc.cluster.local:80;
          proxy_pass $upstream;
          include /etc/nginx/proxy-common.conf;
        }
    
        # --- order-service (port 3003): GET/POST /cart, POST /checkout,
        #     GET /orders, GET /orders/:id, POST /orders/:id/cancel, GET /coupons
        location ~ ^/(cart|checkout|orders|orders/.*|coupons)$ {
          set $upstream http://order-service.ecommerce-dev.svc.cluster.local:80;
          proxy_pass $upstream;
          include /etc/nginx/proxy-common.conf;
        }
      }
    }
