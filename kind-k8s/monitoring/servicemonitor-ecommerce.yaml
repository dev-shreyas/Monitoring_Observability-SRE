apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ecommerce-services
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
    - ecommerce-dev
  selector:
    matchLabels:
      monitoring: enabled
  endpoints:
  - port: http
    path: /metrics
    interval: 60s   # matches prometheusSpec.scrapeInterval (kube-prometheus-stack-values.yaml)
