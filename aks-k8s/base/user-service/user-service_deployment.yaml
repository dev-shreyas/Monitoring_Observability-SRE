apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: user-service
  name: user-service
  namespace: ecommerce-dev
spec:
  replicas: 2
  revisionHistoryLimit: 5           ## keep last 5 ReplicaSets for easy rollback
  selector:
    matchLabels:
      app: user-service
      # Intentionally NOT including azure.workload.identity/use here. A Deployment's
      # selector is immutable once created, so anything added is permanent.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1                 # 1 extra pod may be scheduled above the desired count
      maxUnavailable: 0           # zero downtime -- never drop below desired replicas
  template:
    metadata:
      labels:
        app: user-service
        # Required for Workload Identity. Without it the mutating webhook never injects
        # the projected token or auth env vars, and the annotated ServiceAccount does
        # nothing at all.
        azure.workload.identity/use: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
    spec:
      serviceAccountName: user-service-sa
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: user-service
              azure.workload.identity/use: "true"
      # Pod-level hardening (P0.7). RuntimeDefault applies the container runtime's
      # seccomp profile, which blocks ~60 syscalls (kernel module loading, kexec,
      # namespace tricks) that a Node or nginx process never needs. Together with the
      # container settings below this satisfies Pod Security "restricted", which the
      # ecommerce-dev namespace now ENFORCES.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - image: acrecommercedevt7o2q.azurecr.io/user-service:v1.0.0
        name: user-service
        ports:
        - containerPort: 3001
        # Was missing: without it user-service fell back to its 3-product stub catalogue
        # and wishlists 404'd for every other product. Since P0.2 a production pod with
        # no URL refuses to start instead, so this line is now required.
        env:
        - name: PRODUCT_SERVICE_URL
          value: "http://product-service.ecommerce-dev.svc.cluster.local:80"
        envFrom:
        - secretRef:
            name: user-service-secrets   # created by the CSI driver during volume mount,
                                         # not by kubectl -- it does not exist until a pod
                                         # mounts the SecretProviderClass successfully
        resources:
          requests:
            cpu: 100m
            memory: 250Mi
          limits:
            cpu: 500m
            memory: 500Mi
        # STARTUP PROBE: liveness and readiness do not begin until this has succeeded once.
        # Without it, a pod that starts slowly -- loading the OpenTelemetry auto-instrumentation
        # on a CPU-contended node took 1m44s on 2026-11-11 -- is killed by the liveness probe
        # (~75s budget) before it ever finishes starting, and restarts forever. This allows up
        # to 3 minutes for a start, while liveness keeps its quick reaction for a pod that
        # hangs AFTER it started.
        startupProbe:
          httpGet:
            path: /health
            port: 3001
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 36
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
          - name: secrets-store
            mountPath: "/mnt/secrets-store"
            readOnly: true
        securityContext:
          runAsNonRoot: true
          # Required alongside runAsNonRoot because the Dockerfile ends with
          # "USER appuser" -- a name, not a number. The kubelet cannot resolve a username
          # without starting the container, so it refuses to start it:
          #   Error: container has runAsNonRoot and image has non-numeric user (appuser)
          # These are the ids "adduser -S appuser -G appgroup" produces on Alpine, shared
          # by all three services since all three Dockerfiles use the same pattern.
          runAsUser: 100
          runAsGroup: 101
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          # Drop every Linux capability: the process listens on an unprivileged port
          # (>1024) and needs none. Without this the container keeps the runtime's
          # default set (NET_RAW, CHOWN, SETUID...), which an attacker who got code
          # execution could use, e.g. NET_RAW to craft packets for ARP spoofing.
          capabilities:
            drop: ["ALL"]
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "user-service-azure-kv-secrets"
