apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: user-service-azure-kv-secrets
  namespace: ecommerce-dev
spec:
  provider: azure
  parameters:
    # user-service's own identity. Each service has its own; these ids are not
    # interchangeable, and a wrong one fails only at pod mount time.
    clientID: "f94e6269-1893-4b08-847d-7a86c1ec1200" # workload_identity_client_ids["user-service"]
    usePodIdentity: "false"
    useVMManagedIdentity: "false"

    keyvaultName: "kv-ecommerce-dev-v0t1y"
    tenantId: "763d7adb-4014-4645-aaf8-92110b81d460"

    # Note sql-users-connection-string, NOT sql-connection-string. The latter points at
    # db-orders and belongs to order-service; user-service owns db-users. Using the wrong
    # one connects successfully to the wrong database, which fails far more confusingly
    # than a connection error would.
    #
    # This whole value is a STRING to Kubernetes -- only the CSI driver parses it, at
    # mount time. Each entry needs its block scalar content on the FOLLOWING lines;
    # "- | objectName: x" is invalid YAML and fails with "did not find expected comment
    # or line break".
    objects: |
      array:
        - |
          objectName: sql-users-connection-string
          objectType: secret
          objectVersion: ""
        - |
          objectName: jwt-signing-key
          objectType: secret
          objectVersion: ""

  # Mirrors the mounted files into a Secret, which is what the Deployment's envFrom reads.
  # It does not exist until a pod mounts this class successfully; if it is missing, the
  # mount is failing.
  secretObjects:
    - secretName: user-service-secrets
      type: Opaque
      data:
        - objectName: sql-users-connection-string
          key: SQL_CONNECTION_STRING
        # JWT_SECRET, not JWT_SIGNING_KEY: the Key Vault secret is named after the guide,
        # but services/user-service/src/config.ts reads process.env.JWT_SECRET. It uses a
        # fail-fast helper, so a wrong name here crash-loops the pod with
        # "Missing required environment variable: JWT_SECRET".
        - objectName: jwt-signing-key
          key: JWT_SECRET
