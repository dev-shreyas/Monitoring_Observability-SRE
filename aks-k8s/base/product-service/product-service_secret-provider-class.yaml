apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: product-service-azure-kv-secrets
  namespace: ecommerce-dev
spec:
  provider: azure
  parameters:
    # product-service's own identity. Each service has its own; these ids are not
    # interchangeable, and a wrong one fails only at pod mount time.
    clientID: "927cf33e-6639-4de2-87ca-9f1a90fb7c03" # workload_identity_client_ids["product-service"]
    usePodIdentity: "false"
    useVMManagedIdentity: "false"

    keyvaultName: "kv-ecommerce-dev-v0t1y"
    tenantId: "763d7adb-4014-4645-aaf8-92110b81d460"

    # Cosmos only -- product-service owns the catalog and has no SQL database, so it is
    # deliberately given no SQL connection string at all. Requesting secrets a service
    # does not need is how a narrow identity quietly becomes a broad one.
    #
    # This whole value is a STRING to Kubernetes -- only the CSI driver parses it, at
    # mount time. Each entry needs its block scalar content on the FOLLOWING lines;
    # "- | objectName: x" is invalid YAML and fails with "did not find expected comment
    # or line break".
    objects: |
      array:
        - |
          objectName: cosmos-endpoint
          objectType: secret
          objectVersion: ""
        - |
          objectName: cosmos-key
          objectType: secret
          objectVersion: ""
        - |
          objectName: jwt-signing-key
          objectType: secret
          objectVersion: ""
        - |
          objectName: internal-api-token
          objectType: secret
          objectVersion: ""

  # Mirrors the mounted files into a Secret, which is what the Deployment's envFrom reads.
  # It does not exist until a pod mounts this class successfully; if it is missing, the
  # mount is failing.
  secretObjects:
    - secretName: product-service-secrets
      type: Opaque
      data:
        # COSMOS_ENDPOINT / COSMOS_KEY as separate values, not a connection string:
        # services/product-service/src/config.ts reads them individually and never parses
        # one. It defaults every Cosmos value to "", so a wrong name here does NOT crash
        # the pod -- it starts healthy with no database connection, which is worse.
        - objectName: cosmos-endpoint
          key: COSMOS_ENDPOINT
        - objectName: cosmos-key
          key: COSMOS_KEY
        # Was missing: product-service verifies tokens for POST /products/:id/reviews, and
        # without the shared key it used the code default -- every review got 401. Since
        # v2.7 a production pod without it refuses to start at all.
        - objectName: jwt-signing-key
          key: JWT_SECRET
        - objectName: internal-api-token
          key: INTERNAL_API_TOKEN
