apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-ingress
  namespace: ecommerce-dev
  labels:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts: ["aether.shop.com"]
      secretName: ecommerce-dev-tls-cert      # Cert issued by cert-manager + Let's Encrypt, or Key Vault.
  rules:
  - host: aether.shop.com
    http:
      paths:
      - pathType: ImplementationSpecific
        path: "/users(/|$)(.*)"
        backend:
          service: { name: user-service, port: { number: 80 } }
      - pathType: ImplementationSpecific
        path: "/products(/|$)(.*)"
        backend:
          service: { name: product-service, port: { number: 80 } }
      - pathType: ImplementationSpecific
        path: "/orders(/|$)(.*)"
        backend:
          service: { name: order-service, port: { number: 80 } }                    
