apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ecommerce-dev-azure-kv-secrets
  namespace: ecommerce-dev
spec:
  provider: azure
  parameters:
    # Workload Identity mode. The pod proves who it is with the projected service account
    # token from its ServiceAccount, and Azure AD exchanges that for a token belonging to
    # uai-workload-ecommerce-dev, which holds "Key Vault Secrets User" on this vault.
    #
    # The previous config used useVMManagedIdentity: "true" with the AKS *cluster*
    # identity's client ID. Two things were wrong with that: in VM managed identity mode
    # the driver authenticates as the kubelet identity and ignores the ID given here, and
    # neither the cluster nor the kubelet identity has any role on this vault -- so it
    # would have failed with 403 even after the YAML below was corrected.
    clientID: "f0a9597e-7e2e-4754-b414-72e5fea4dab8" # workload_identity_client_ids["order-service"]
    usePodIdentity: "false"
    useVMManagedIdentity: "false"

    keyvaultName: "kv-ecommerce-dev-v0t1y"
    tenantId: "763d7adb-4014-4645-aaf8-92110b81d460"

    # This value is a STRING to Kubernetes, not YAML. kubectl apply will happily accept
    # anything here -- it is parsed only by the CSI driver when a pod mounts the volume,
    # so mistakes surface as FailedMount events rather than as apply errors.
    #
    # Each entry must be its own block scalar with the content on FOLLOWING lines. Writing
    # "- | objectName: foo" puts content on the same line as the block indicator, which is
    # invalid YAML and produced:
    #   failed to yaml unmarshal objects, error: yaml: line 2: did not find expected
    #   comment or line break
    objects: |
      array:
        - |
          objectName: sql-connection-string
          objectType: secret
          objectVersion: ""
        - |
          objectName: jwt-signing-key
          objectType: secret
          objectVersion: ""
        - |
          objectName: servicebus-connection-string
          objectType: secret
          objectVersion: ""
        - |
          objectName: internal-api-token
          objectType: secret
          objectVersion: ""

  # Mirrors the mounted files into a regular Kubernetes Secret, which is what the
  # Deployment's envFrom reads. This Secret does not exist until a pod successfully
  # mounts the volume -- the CSI driver creates it as part of the mount, and deletes it
  # when the last pod using it goes away. If it is missing, the mount is failing.
  secretObjects:
    - secretName: order-service-secrets
      type: Opaque
      data:
        - objectName: sql-connection-string
          key: SQL_CONNECTION_STRING
        # JWT_SECRET and SERVICE_BUS_CONNECTION_STRING are the names
        # services/order-service/src/config.ts actually reads. The previous
        # JWT_SIGNING_KEY / SERVICEBUS_CONNECTION_STRING spellings crashed nothing,
        # because that config defaults every value to "" -- the service simply ran with
        # the insecure dev-fallback JWT secret and no Service Bus connection at all.
        # Cosmos is dropped entirely: order-service never reads it.
        - objectName: jwt-signing-key
          key: JWT_SECRET
        - objectName: servicebus-connection-string
          key: SERVICE_BUS_CONNECTION_STRING
        # Calls product-service's /internal stock API and guards our own /internal routes.
        - objectName: internal-api-token
          key: INTERNAL_API_TOKEN
