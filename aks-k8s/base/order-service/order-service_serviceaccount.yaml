# The pod template in order-service_deployment.yaml sets serviceAccountName:
# order-service-sa. Kubernetes refuses to create a pod referencing a ServiceAccount that
# does not exist, so without this the ReplicaSet reports FailedCreate and no pod is ever
# made -- kubectl get pods shows nothing at all rather than a failing pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-service-sa
  namespace: ecommerce-dev
  annotations:
    # Client ID of uai-workload-order-service-dev. Every service has its OWN identity, so
    # this value belongs to order-service alone -- pasting product-service's id here fails
    # token exchange at runtime, not at apply time.
    #
    # It must be the CLIENT id, not the principal/object id. Both are GUIDs, so the wrong
    # one looks equally plausible and fails the same silent way.
    #
    # Re-read it after any rebuild of the identity with:
    #   terraform output -json workload_identity_client_ids | jq -r '."order-service"'
    azure.workload.identity/client-id: "f0a9597e-7e2e-4754-b414-72e5fea4dab8"
